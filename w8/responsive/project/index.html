<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <section class="hero">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSf9qhrDGOy2yYZb1vzPucuuzkJIxOeGQhL5vZ_Lq_JHw&s=10">
        <div class="hero-content">
            <h1 class="product-title">Laptop Pro X1</h1>
            <h2 class="product-price">4,999₪</h2>
            <p class="product-desc">מחשב נייד מקצועי עם מעבד 16GB RAM, Intel Core i7, ו-SSD 512GB. מסך 15.6 אינץ' Full HD עם זמן סוללה של 12 שעות.</p>
            <button class="btn">הוסף לסל</button>
        </div>

    <h1 class="specs-title">מפרט טכני</h1>
    <section class="specs">
        <div class="box">
            <h3 class="box-title">Intel i7</h3>
            <p class="box-desc">מעבד</p>
        </div>
        <div class="box">
            <h3 class="box-title">16GB</h3>
            <p class="box-desc">RAM</p>
        </div>
        <div class="box">
            <h3 class="box-title">512GB SSD</h3>
            <p class="box-desc">אחסון</p>
        </div>
        <div class="box">
            <h3 class="box-title">12h</h3>
            <p class="box-desc">סוללה</p>
        </div>
    </section>

</body>
</html>
