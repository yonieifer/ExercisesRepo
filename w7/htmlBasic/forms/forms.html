<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="http://localhost:3000/register" method="post">
        <label for="name">full name</label>
        <input type="text" required id="name" name="name" minlength="2">
        <br>
        <label for="email">email</label>
        <input type="email" required id="email" name="email">
        <br>
        <label for="password">password</label>
        <input type="password" required id="password" name="password" minlength="8">
        <br>
        <label for="age">age</label>
        <input type="number" id="age" name="age" min="13" max="120">
        <br>
        <label for="role">selct role:</label>
        <select name="role" id="role">
            <option value="admin">admin</option>
            <option value="user">user</option>
        </select>
        <br>
        <label for="agreement">agree to terms</label>
        <input type="checkbox" required id="agreement" name="agreement" value="yes">

        <button type="submit">submit</button>
    </form>
</body>
</html>
